name: 构建并发布安装包
run-name: 发布 Ant Browser：${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: davidzhang12138/Ant-Browser
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout private source tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "Invalid release Tag: $RELEASE_TAG" >&2
            exit 1
          }
          echo "PACKAGE_VERSION=${RELEASE_TAG#[vV]}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build unsigned macOS package
        run: bash publish/mac/publish-mac.sh --arch "${{ matrix.arch }}" --version "$PACKAGE_VERSION"

      - name: Validate app bundle
        run: |
          set -euo pipefail
          app_path="publish/output/AntBrowser.app"
          zip_path="$(ls -1 publish/output/AntBrowser-*-macos-${{ matrix.arch }}.zip | head -n 1)"
          echo "Validating: $app_path"
          test -x "$app_path/Contents/MacOS/ant-chrome"
          test -x "$app_path/Contents/MacOS/bin/xray"
          test -x "$app_path/Contents/MacOS/bin/sing-box"
          plutil -lint "$app_path/Contents/Info.plist"
          ditto -x -k "$zip_path" /tmp/ant-browser-macos-validate
          test -x "/tmp/ant-browser-macos-validate/AntBrowser.app/Contents/MacOS/ant-chrome"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: publish/output/AntBrowser-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout private source tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "Invalid release Tag: $RELEASE_TAG" >&2
            exit 1
          }
          echo "PACKAGE_VERSION=${RELEASE_TAG#[vV]}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            dpkg-dev \
            fakeroot \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        run: bash publish/linux/publish-linux.sh --arch "${{ matrix.arch }}" --version "$PACKAGE_VERSION"

      - name: Validate deb package metadata
        run: |
          set -euo pipefail
          deb_file="$(ls -1 publish/output/*_${{ matrix.arch }}.deb | head -n 1)"
          tar_file="$(ls -1 publish/output/*-linux-${{ matrix.arch }}.tar.gz | head -n 1)"
          echo "Validating: $deb_file"
          dpkg-deb -I "$deb_file"
          dpkg-deb -c "$deb_file" >/dev/null
          tar -tzf "$tar_file" > /tmp/ant-browser-tar-list
          grep -q '^AntBrowser/' /tmp/ant-browser-tar-list

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            publish/output/*_${{ matrix.arch }}.deb
            publish/output/*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows amd64
    runs-on: windows-2022

    steps:
      - name: Checkout private source tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "Invalid release Tag: $RELEASE_TAG" >&2
            exit 1
          }
          echo "PACKAGE_VERSION=${RELEASE_TAG#[vV]}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows packages
        shell: pwsh
        run: .\publish\windows\publish-windows.ps1 -Arch amd64 -Version "$env:PACKAGE_VERSION"

      - name: Validate Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem publish/output/AntBrowser-*-windows-amd64.zip | Select-Object -First 1
          $setup = Get-ChildItem publish/output/AntBrowser-Setup-*.exe | Select-Object -First 1
          if (-not $zip) { throw "Windows zip artifact not found" }
          if (-not $setup) { throw "Windows setup artifact not found" }
          $dest = Join-Path $env:RUNNER_TEMP "ant-browser-windows-validate"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          foreach ($path in @(
            "AntBrowser/ant-chrome.exe",
            "AntBrowser/bin/xray.exe",
            "AntBrowser/bin/sing-box.exe",
            "AntBrowser/config.yaml"
          )) {
            if (-not (Test-Path (Join-Path $dest $path))) {
              throw "Missing file in Windows zip: $path"
            }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: |
            publish/output/AntBrowser-*-windows-amd64.zip
            publish/output/AntBrowser-Setup-*.exe
          if-no-files-found: error

  release:
    name: 在公开发布仓库创建 Release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 校验版本 Tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[vV][0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "Invalid release Tag: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: 生成更新清单
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, json, os
          version = os.environ["VERSION"].lstrip("vV")
          repo = os.environ["REPO"]
          specs = {
              "windows-amd64": ["AntBrowser-Setup-*.exe", "AntBrowser-*-windows-amd64.zip"],
              "darwin-amd64": ["AntBrowser-*-macos-amd64.zip"],
              "darwin-arm64": ["AntBrowser-*-macos-arm64.zip"],
              "linux-amd64": ["ant-browser_*_amd64.deb", "AntBrowser-*-linux-amd64.tar.gz"],
              "linux-arm64": ["ant-browser_*_arm64.deb", "AntBrowser-*-linux-arm64.tar.gz"],
          }
          assets = {}
          for key, patterns in specs.items():
              hits = []
              for pattern in patterns:
                  hits = sorted(glob.glob(os.path.join("release-assets", pattern)))
                  if hits:
                      break
              if not hits:
                  continue
              path = hits[0]
              digest = hashlib.sha256()
              with open(path, "rb") as source:
                  for chunk in iter(lambda: source.read(1 << 20), b""):
                      digest.update(chunk)
              assets[key] = {"name": os.path.basename(path), "sha256": digest.hexdigest()}
          if not assets:
              raise SystemExit("没有找到可识别的安装包")
          manifest = {
              "version": version,
              "notesUrl": f"https://github.com/{repo}/releases/tag/{os.environ['VERSION']}",
              "force": False,
              "assets": assets,
          }
          with open("release-assets/update-manifest.json", "w", encoding="utf-8") as target:
              json.dump(manifest, target, ensure_ascii=False, indent=2)
          print("update manifest:", json.dumps(manifest, ensure_ascii=False))
          PY

      - name: 在公开发布仓库创建 Release
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT

          assets_list="$(find release-assets -maxdepth 1 -type f ! -name 'update-manifest.json' -printf '%f\n' | sort)"
          asset_count="$(wc -l <<< "$assets_list")"
          test "$asset_count" -gt 0

          prerelease_flag=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          source_sha="$(GH_TOKEN="${GH_TOKEN}" gh api "repos/${SOURCE_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"

          {
            printf '## 构建产物\n\n'
            printf -- '- 版本：`%s`\n' "$RELEASE_TAG"
            printf -- '- 源码提交：`%s`\n' "$source_sha"
            printf -- '- 平台：Windows、Linux、macOS（共 %s 个安装包）\n\n' "$asset_count"
            printf '%s\n' "$assets_list" | sed 's/^/- `/' | sed 's/$/`/'
            printf '\n安装包由公开仓库 [%s](https://github.com/%s) 的自动化构建发布。\n' "${RELEASE_REPO#*/}" "$RELEASE_REPO"
          } > "$notes_file"

          if GH_TOKEN="${PUBLIC_TOKEN}" gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            GH_TOKEN="${PUBLIC_TOKEN}" gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$RELEASE_REPO" \
              --clobber
            GH_TOKEN="${PUBLIC_TOKEN}" gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPO" \
              --title "Ant Browser ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              --draft=false \
              "${prerelease_flag[@]}"
          else
            GH_TOKEN="${PUBLIC_TOKEN}" gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$RELEASE_REPO" \
              --target main \
              --title "Ant Browser ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              "${prerelease_flag[@]}"
          fi
